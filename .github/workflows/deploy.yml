name: Deploy to VPS

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The VPS user (VPS_USERNAME) can run only /usr/local/sbin/ssh-monitor-deploy
# with sudo. See deploy/ and the "GitHub Actions" section of README.md.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: webserver/go.mod

      - name: Install upx
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build and Compress
        run: |
          cd webserver
          go build -ldflags="-s -w" -o ../ssh-monitor .
          cd ..
          upx ssh-monitor

      - name: Upload the binary
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "ssh-monitor"
          target: "upload"
          strip_components: 0

      - name: Install and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo /usr/local/sbin/ssh-monitor-deploy < ~/upload/ssh-monitor
            rm -f ~/upload/ssh-monitor
